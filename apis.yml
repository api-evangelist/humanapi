aid: humanapi
name: HumanAPI
description: Human API is a health-intelligence platform that provides real-time, programmatic access
  to structured digital health and medical data aggregated from providers, labs, pharmacies, devices and
  wellness apps. Its Admin API lets enterprises (notably life-insurance underwriting) create users, submit
  data-retrieval orders, connect a member's health-data sources, and fetch generated individual and combined
  reports, with webhook notifications on order completion. Authentication is a bearer JWT obtained from
  client-credentials token endpoints. Human API was founded in 2013, backed by a16z, and acquired by LexisNexis
  Risk Solutions in 2021.
